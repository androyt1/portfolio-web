<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Andrew — Senior Frontend & AI Engineer based in London. Building at the frontier of React, TypeScript, and LangChain." />
    <title>Andrew · Frontend & AI Engineer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Anti-flash script — runs BEFORE React loads.
      Reads localStorage and sets data-theme on <html> immediately.
      Without this, the page flashes dark → light on refresh for light-mode users.
    -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved)
          } else {
            // Respect OS preference on first visit
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
            document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light')
          }
        } catch(e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
